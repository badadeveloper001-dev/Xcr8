name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    name: Frontend — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Android OAuth regression tests
        run: pnpm test:android

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  backend:
    name: Backend — Python syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Compile check — backend
        run: python -m compileall backend/app

      - name: Critical backend tests
        run: PYTHONPATH=backend pytest -q backend/tests

      - name: Compile check — ai-services
        run: python -m compileall ai-services/app
