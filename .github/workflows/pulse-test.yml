name: Focused Backend Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pulse:
    name: Backend — account deletion and Pulse tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r backend/requirements.txt -r ai-services/requirements.txt pytest

      - name: Run focused Pulse tests
        run: PYTHONPATH=backend pytest -q backend/tests/test_account_deletion.py backend/tests/test_pulse_costs.py
